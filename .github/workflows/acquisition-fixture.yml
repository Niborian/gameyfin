name: Isolated authorized acquisition acceptance
on:
  pull_request:
    branches: [main]
    paths: ['app/src/**/requests/**', 'tools/acquisition-live-fixture.py', '.github/workflows/acquisition-fixture.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acquisition-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Rehearse real isolated pair with invented no-payload magnet
        run: python3 tools/acquisition-live-fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acquisition-real-pair-test-results
          path: app/build/test-results/test/TEST-*AcquisitionLiveProviderTest.xml
          retention-days: 7
