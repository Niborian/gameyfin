name: NEVER MERGE - reviewed PR156 original-UI three-round acceptance
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: Parent reviewed this exact retained-image UI-only workflow
        required: true
        type: boolean
        default: false
      reviewed_head:
        description: Full exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: public81-ui-first-pass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ui:
    if: >-
      github.repository == 'Niborian/gameyfin' &&
      github.ref == 'refs/heads/codex/public156-ui-acceptance-20261023' &&
      github.event_name == 'workflow_dispatch' && inputs.reviewed == true &&
      inputs.reviewed_head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pure exact source-binding tests only; no network or app build
        run: timeout --signal=TERM --kill-after=2s 30s python3 -B -m unittest discover -s scripts/browser-benchmark -p test_public_image_source_binding.py
      - name: Build only reviewed Chrome image; no app build or test suites
        run: |
          mkdir -p .benchmark/public81-ui
          timeout --signal=TERM --kill-after=2s 180s docker build --file scripts/browser-benchmark/Dockerfile --iidfile .benchmark/public81-ui/browser.id scripts/browser-benchmark
      - name: Retained reviewed PR156 original-UI three-round pass; no app rebuild or scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=2s 598s python3 -B scripts/browser-benchmark/public_image_ui.py --browser-image "$(cat .benchmark/public81-ui/browser.id)" --output .benchmark/public81-ui/result.json --ui-rounds 3
      - name: Exact current-job cleanup only; no global prune
        if: always()
        run: timeout --signal=TERM --kill-after=2s 40s python3 -B scripts/browser-benchmark/public_image_ui.py --cleanup-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: public81-original-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark/public81-ui/*.json
          retention-days: 7
          if-no-files-found: warn
