name: Reviewed Chrome-only cancellation probe
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: Parent reviewed this exact diagnostic-only workflow
        required: true
        type: boolean
        default: false
      reviewed_head:
        description: Full exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chrome-only-cancel-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'Niborian/gameyfin' &&
      github.event_name == 'workflow_dispatch' && inputs.reviewed == true &&
      inputs.reviewed_head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build only reviewed Chrome fixture image; never publish
        run: |
          mkdir -p .benchmark/cancel-probe
          docker build --file scripts/browser-benchmark/Dockerfile --iidfile .benchmark/cancel-probe/image.id scripts/browser-benchmark
      - name: Actual sandboxed network-none protocol probe; not application acceptance
        run: |
          timeout --signal=TERM --kill-after=1s 99s python3 -B scripts/browser-benchmark/chrome_smoke.py --cancel-probe --image "$(cat .benchmark/cancel-probe/image.id)" --output .benchmark/cancel-probe/result.json
      - name: Exact current-job probe-only cleanup; never global prune
        if: always()
        run: timeout --signal=TERM --kill-after=1s 12s python3 -B scripts/browser-benchmark/chrome_smoke.py --cancel-probe --cleanup-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: chrome-only-cancel-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark/cancel-probe/*.json
          retention-days: 7
          if-no-files-found: warn
