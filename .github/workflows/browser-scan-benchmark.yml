name: NEVER MERGE - reviewed retained one-app scan/browser diagnostic
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: Parent reviewed this exact one-app diagnostic commit
        required: true
        type: boolean
        default: false
      reviewed_head:
        description: Full exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: one-app-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'Niborian/gameyfin' &&
      github.ref == 'refs/heads/codex/one-app-probe-20261023' &&
      github.event_name == 'workflow_dispatch' && inputs.reviewed == true &&
      inputs.reviewed_head == github.sha
    runs-on: ubuntu-24.04
    # 938s bounded steps plus setup/upload margin. App/browser/scan deadlines
    # remain unchanged; reserve time for exact cleanup after a failed step.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Focused diagnostic contracts only; no application build
        run: |
          timeout --signal=TERM --kill-after=2s 60s python3 -B -m unittest discover -s scripts/browser-benchmark -p 'test_one_app*.py' -v
          timeout --signal=TERM --kill-after=2s 30s python3 -B -m unittest discover -s scripts/browser-benchmark -p 'test_scrape_transport.py' -v
          timeout --signal=TERM --kill-after=2s 30s python3 -B -m unittest discover -s scripts/browser-benchmark -p 'test_final_gate_diagnostics.py' -v
      - name: Build only pinned Chrome image; no application build
        run: |
          mkdir -p .benchmark/one-app-probe
          timeout --signal=TERM --kill-after=2s 180s docker build --file scripts/browser-benchmark/Dockerfile --iidfile .benchmark/one-app-probe/browser.id scripts/browser-benchmark
      - name: One retained-image scan/browser diagnostic; not paired acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=2s 598s python3 -B scripts/browser-benchmark/run_one_app_probe.py --parent-reviewed-one-app --browser-image "$(cat .benchmark/one-app-probe/browser.id)" --output .benchmark/one-app-probe/result.json
      - name: Exact current-job cleanup only; no global prune
        if: always()
        run: timeout --signal=TERM --kill-after=2s 40s python3 -B scripts/browser-benchmark/run_one_app_probe.py --cleanup-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: retained-one-app-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark/one-app-probe/*.json
          retention-days: 7
          if-no-files-found: warn
