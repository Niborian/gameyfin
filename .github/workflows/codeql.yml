name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile production code
        # CodeQL must observe compiler processes; restoring Gradle task outputs leaves it with no source to analyze.
        # Analysis needs production compilation, not the entire test/benchmark suite or packaging.
        # In-process Kotlin plus extraction needs more class metadata than the ordinary build.
        # Override only this CI daemon; application heap/container limits remain unchanged.
        run: ./gradlew clean classes -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g' --no-build-cache --no-daemon --console=plain --max-workers=2

      - uses: github/codeql-action/analyze@v4
