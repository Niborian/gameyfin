name: Published 2.4.6 original editor acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - app/src/test/kotlin/org/gameyfin/tools/OriginalEditorImageFixtureTest.kt
      - app/src/test/kotlin/org/gameyfin/tools/FixtureRuntime.kt
      - app/src/test/kotlin/org/gameyfin/tools/FixtureValidationTest.kt
      - scripts/original-editor-image.cts
      - .github/workflows/original-editor-image.yml
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed fixture commit SHA, not an application image selector
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: published246-editor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-editor:
    if: github.repository == 'Niborian/gameyfin' && (github.event_name == 'pull_request' || inputs.reviewed_head == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Load immutable published application and existing pinned browser only
        run: |
          timeout --signal=TERM --kill-after=2s 180s docker pull ghcr.io/niborian/gameyfin@sha256:49981f66eb6faff0fdef7307f0c2ba0098f1692f22a004e92bfe13707784a3ef
          timeout --signal=TERM --kill-after=2s 180s docker pull ghcr.io/puppeteer/puppeteer@sha256:893118e0546f8cee371a0ae09c8489d1e9c40de28c45df9d811d4233203b81a3
      - name: One tiny original-UI editor save and clicked exact ZIP; no image build
        env:
          GAMEYFIN_ORIGINAL_EDITOR_FIXTURE: published-246-synthetic-only
        run: |
          timeout --signal=TERM --kill-after=10s 600s ./gradlew :app:test --tests org.gameyfin.tools.FixtureValidationTest --tests org.gameyfin.tools.OriginalEditorImageFixtureTest -x :app:vaadinPrepareFrontend -x :app:vaadinBuildFrontend --max-workers=2 --no-daemon --console=plain
      - name: Exact labelled fallback cleanup if controller did not finish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .editor246/result.json ]]; then
            owner=$(jq -er '.fixtureOwner' .editor246/result.json)
            [[ "$owner" =~ ^[a-f0-9]{32}$ ]]
            ids=$(timeout 5s docker ps -aq --no-trunc --filter "label=gameyfin.fixture.owner=$owner")
            for id in $ids; do
              [[ "$id" =~ ^[a-f0-9]{64}$ ]]
              [[ "$(timeout 5s docker inspect --format '{{index .Config.Labels "gameyfin.fixture.owner"}}' "$id")" == "$owner" ]]
              timeout 10s docker rm --force "$id" >/dev/null
            done
            [[ -z "$(timeout 5s docker ps -aq --no-trunc --filter "label=gameyfin.fixture.owner=$owner")" ]]
            network="gameyfin-fixture-$owner"
            existing=$(timeout 5s docker network ls -q --filter "name=^${network}$")
            if [[ -n "$existing" ]]; then
              [[ "$(timeout 5s docker network inspect --format '{{index .Labels "gameyfin.fixture.owner"}}' "$network")" == "$owner" ]]
              timeout 5s docker network rm "$network" >/dev/null
            fi
            [[ -z "$(timeout 5s docker network ls -q --filter "name=^${network}$")" ]]
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: published246-editor-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          # Deliberately no database, ZIP, credentials, source archive or browser output.
          path: .editor246/result.json
          retention-days: 7
          if-no-files-found: warn
