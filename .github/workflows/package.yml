name: Verify and publish unofficial variant image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a version candidate or promote a reviewed digest to latest
        required: true
        type: choice
        default: candidate
        options:
          - candidate
          - promote
      version:
        description: Exact existing version tag to promote (promotion only)
        required: false
        type: string
      digest:
        description: Reviewed sha256 digest of that version (promotion only)
        required: false
        type: string

env:
  IMAGE_NAME: ghcr.io/niborian/gameyfin

jobs:
  verify:
    name: Test fork behavior
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify the release version is synchronized
        id: version
        shell: bash
        run: |
          gradle_version=$(sed -nE 's/^version = "([^"]+)"/\1/p' build.gradle.kts)
          web_version=$(node -p "JSON.parse(require('fs').readFileSync('app/package.json')).version")
          if [ -z "$gradle_version" ] || [ "$gradle_version" != "$web_version" ]; then
            echo "Release version mismatch: Gradle=$gradle_version web=$web_version" >&2
            exit 1
          fi
          echo "value=$gradle_version" >> "$GITHUB_OUTPUT"

      - name: Run automated tests
        run: ./gradlew :app:test --no-daemon --console=plain

      - name: Verify bounded synthetic proxy smoke validators
        run: |
          python3 -B scripts/test-proxy-download-smoke.py
          python3 -B scripts/test-proxy-fixture-hook.py
          pwsh -NoProfile -File scripts/test-exposure-fixture-bindings.ps1

      - name: Require Linux hardlink and variant scan fixture evidence
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = [
              'org.gameyfin.app.games.variants.HardlinkMirrorServiceTest',
              'org.gameyfin.app.libraries.VariantScanIntegrityFixtureTest',
          ]
          for name in suites:
              report = Path(f'app/build/test-results/test/TEST-{name}.xml')
              root = ET.parse(report).getroot()
              if int(root.get('tests', '0')) == 0 or any(int(root.get(key, '0')) for key in ('failures', 'errors', 'skipped')):
                  raise SystemExit(f'Missing passing Linux filesystem evidence: {name}')
              print(f'{name}: {root.get("tests")} passed, none skipped')
          PY

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          check_run: false

  package:
    name: Publish AMD64 candidate
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'candidate'
    concurrency:
      group: gameyfin-manual-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore fork plugin signing key
        env:
          GAMEYFIN_KEYSTORE_BASE64: ${{ secrets.GAMEYFIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$GAMEYFIN_KEYSTORE_BASE64"
          printf '%s' "$GAMEYFIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gameyfin-plugin-signing.p12"
          chmod 600 "$RUNNER_TEMP/gameyfin-plugin-signing.p12"

      - name: Build production application artifact
        env:
          GAMEYFIN_KEYSTORE_PASSWORD: ${{ secrets.GAMEYFIN_KEYSTORE_PASSWORD }}
          GAMEYFIN_KEYSTORE_PATH: ${{ runner.temp }}/gameyfin-plugin-signing.p12
          GAMEYFIN_KEYSTORE_TYPE: PKCS12
        run: ./gradlew clean build -Pvaadin.productionMode=true --no-daemon --console=plain

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine immutable candidate tag
        id: tags
        shell: bash
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:${{ needs.verify.outputs.version }}" >/dev/null 2>&1; then
            echo "Release tag ${{ needs.verify.outputs.version }} already exists and must not be moved." >&2
            exit 1
          fi
          tags="${IMAGE_NAME}:${{ needs.verify.outputs.version }}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GitHub stores the signed provenance below. Registry attestations
          # otherwise appear as additional sha256-* GHCR package versions.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/Niborian/gameyfin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.description=Unofficial Gameyfin variant build for preserving torrent-managed game paths
            org.opencontainers.image.vendor=Niborian
            org.opencontainers.image.authors=Niborian
          cache-from: type=gha,scope=gameyfin-amd64
          cache-to: type=gha,mode=max,scope=gameyfin-amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Keep the signed attestation in GitHub; GHCR stores registry
          # attestations as additional sha256-* package versions.
          push-to-registry: false

      - name: Export SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: gameyfin-sbom.spdx.json
          output-file: gameyfin-sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: gameyfin-sbom-${{ github.sha }}
          path: gameyfin-sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote reviewed digest to latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'promote'
    concurrency:
      group: gameyfin-manual-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate and promote without rebuilding
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Supply an exact semantic version tag to promote." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Supply the reviewed sha256 digest." >&2
            exit 1
          fi
          candidate=$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ "$candidate" != "$EXPECTED_DIGEST" ]]; then
            echo "Version tag digest does not match the reviewed digest." >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${EXPECTED_DIGEST}"
          promoted=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ "$promoted" != "$EXPECTED_DIGEST" ]]; then
            echo "Promotion did not preserve the reviewed digest." >&2
            exit 1
          fi

  pull-request-image:
    name: Build AMD64 image (PR)
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build pull request application artifact
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        id: staging-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/gameyfin-staging-image.tar
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Niborian/gameyfin
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.description=Unofficial Gameyfin variant build for preserving torrent-managed game paths
            org.opencontainers.image.vendor=Niborian
            org.opencontainers.image.authors=Niborian
          cache-from: type=gha,scope=gameyfin-amd64

      - name: Record staging image archive integrity
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          BUILT_IMAGE_ID: ${{ steps.staging-image.outputs.imageid }}
        run: |
          cd /tmp
          sha256sum gameyfin-staging-image.tar > gameyfin-staging-image.sha256
          printf 'source_head=%s\nimage_id=%s\n' "$REVIEWED_HEAD" "$BUILT_IMAGE_ID" > gameyfin-staging-image.txt

      - name: Retain isolated staging image without publishing a tag
        uses: actions/upload-artifact@v4
        with:
          name: staging-image-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/gameyfin-staging-image.tar
            /tmp/gameyfin-staging-image.sha256
            /tmp/gameyfin-staging-image.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Verify pinned official plugin source and load only this PR image
        env:
          BUILT_IMAGE_ID: ${{ steps.staging-image.outputs.imageid }}
        run: |
          # Official upstream commit 005a1611ce4495e9080e143ec4bc2f1f0b91e633.
          # These exact source trees were verified against gameyfin/gameyfin.
          test "$(git rev-parse HEAD:plugins/steam)" = 52104d217dcfa24fb6bfd54ee7f6aed6c239b557
          test "$(git rev-parse HEAD:plugins/directdownload)" = 5ac40f7f9b23c7cc67f6b7dee61a211dd395041a
          cd /tmp
          sha256sum -c gameyfin-staging-image.sha256
          docker load --input gameyfin-staging-image.tar
          docker image inspect "$BUILT_IMAGE_ID" >/dev/null

      - name: Exercise actual image H2 scans, recovery and exact selections
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          BUILT_IMAGE_ID: ${{ steps.staging-image.outputs.imageid }}
        run: |
          mapfile -t h2_jars < <(docker run --pull never --rm --network none --entrypoint find "$BUILT_IMAGE_ID" /opt/gameyfin/lib -maxdepth 1 -name 'h2-*.jar')
          test "${#h2_jars[@]}" -eq 1
          sha256sum plugins/steam/build/libs/steam-1.2.0.jar plugins/directdownload/build/libs/directdownload-1.0.2.jar
          python3 -B scripts/rehearsal/run-image-scan.py \
            --image "$BUILT_IMAGE_ID" --source-revision "$REVIEWED_HEAD" \
            --h2-jar "${h2_jars[0]}" \
            --metadata-plugin plugins/steam/build/libs/steam-1.2.0.jar \
            --direct-plugin plugins/directdownload/build/libs/directdownload-1.0.2.jar \
            --output app/build/reports/actual-image-scan.json --interrupt-scan --missing-root-fault --idle-seconds 300

      - name: Retain actual-image synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-image-scan-${{ github.event.pull_request.head.sha }}
          path: app/build/reports/actual-image-scan.json
          retention-days: 7
          if-no-files-found: warn
