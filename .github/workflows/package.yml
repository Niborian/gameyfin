name: Verify and publish unofficial variant image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional additional immutable release tag (for example, 2.4.0-variants.1)"
        required: false
        type: string

env:
  IMAGE_NAME: ghcr.io/niborian/gameyfin

jobs:
  verify:
    name: Test fork behavior
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run automated tests
        run: ./gradlew :app:test --no-daemon --console=plain

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"

  package:
    name: Build and publish AMD64 image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build production application artifact
        env:
          GAMEYFIN_KEYSTORE_PASSWORD: ${{ secrets.GAMEYFIN_KEYSTORE_PASSWORD }}
        run: ./gradlew clean build -Pvaadin.productionMode=true --no-daemon --console=plain

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine immutable image tags
        id: tags
        shell: bash
        run: |
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            case "${{ inputs.tag }}" in
              *[!A-Za-z0-9._-]*|'') echo "Invalid image tag" >&2; exit 1 ;;
            esac
            tags="${tags},${IMAGE_NAME}:${{ inputs.tag }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Niborian/gameyfin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.description=Unofficial Gameyfin variant build for preserving torrent-managed game paths
          cache-from: type=gha,scope=gameyfin-amd64
          cache-to: type=gha,mode=max,scope=gameyfin-amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: gameyfin-sbom.spdx.json
          output-file: gameyfin-sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: gameyfin-sbom-${{ github.sha }}
          path: gameyfin-sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
