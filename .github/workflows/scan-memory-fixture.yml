name: Measure synthetic scan memory

on:
  # Retained historical fixture, opt-in only. The active delivery plan does not
  # authorize automatic benchmark campaigns on ordinary implementation PRs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Synthetic full-scan resource fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate isolated actual-image scan inputs
        run: |
          mkdir -p app/build/reports
          ./gradlew :app:generateScanFixture --args='--output app/build/reports/image-scan-fixture --container-fixture-root /fixture' -x :app:vaadinBuildFrontend --no-daemon --console=plain
      - name: Measure fixture recovery with explicit heap
        run: ./gradlew :app:test --tests org.gameyfin.app.libraries.ScanMemoryBenchmarkTest --tests org.gameyfin.tools.ImageScanContractsTest -PscanBenchmark=true -PscanBenchmarkHeap=512m -PscanBenchmarkGames=1000 -x :app:vaadinBuildFrontend --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-scan-memory-evidence
          path: |
            app/build/reports/scan-memory-benchmark.json
            app/build/reports/image-scan-fixture/manifest.json
            app/build/reports/image-scan-fixture/seed.sql
            app/build/test-results/test/TEST-org.gameyfin.app.libraries.ScanMemoryBenchmarkTest.xml
