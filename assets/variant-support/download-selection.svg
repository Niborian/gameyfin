<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Exact download selection</title><desc id="desc">Concept diagram: choose a version, include its required grouped base and checked optional patch, exclude unchecked DLC. The output contains only selected paths. Example sizes are illustrative, not measured archive sizes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a9b1c6" stroke-width="1.4"/></marker></defs>
<rect width="960" height="480" rx="24" fill="#10131c"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="36" y="46" fill="#b69cff" font-size="12" font-weight="700">EXACT DOWNLOAD SELECTION</text><text x="36" y="82" fill="#ffffff" font-size="30" font-weight="700">Your choice defines the output.</text><rect x="36" y="124" width="888" height="54" rx="14" fill="#1d2435" stroke="#36425a"/><text x="58" y="158" fill="#b69cff" font-size="13" font-weight="700">1  CHOOSE A VERSION</text><text x="294" y="158" fill="#ffffff" font-size="20" font-weight="700">Version 1.3</text><text x="626" y="158" fill="#bac3d9" font-size="13" font-weight="400">Concept illustration · not a screenshot</text><rect x="36" y="208" width="540" height="156" rx="14" fill="#1d2435" stroke="#36425a"/><text x="58" y="241" fill="#b69cff" font-size="13" font-weight="700">2  SELECT CONTENT</text><text x="58" y="276" fill="#ffffff" font-size="19" font-weight="700">✓  Base game · 7 grouped parts</text><text x="420" y="276" fill="#80dfbd" font-size="14" font-weight="400">Required</text><text x="58" y="309" fill="#ffffff" font-size="19" font-weight="400">✓  Patch</text><text x="420" y="309" fill="#80dfbd" font-size="14" font-weight="400">Selected</text><text x="58" y="342" fill="#bac3d9" font-size="19" font-weight="400">—  DLC</text><text x="420" y="342" fill="#bac3d9" font-size="14" font-weight="400">Not selected</text><path d="M576 286H618" stroke="#a9b1c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="632" y="208" width="292" height="156" rx="14" fill="#16332f" stroke="#4da890"/><text x="654" y="243" fill="#80dfbd" font-size="13" font-weight="700">3  DOWNLOAD</text><text x="654" y="279" fill="#ffffff" font-size="23" font-weight="700">Base + patch only</text><text x="654" y="312" fill="#bac3d9" font-size="16" font-weight="400">Unchecked DLC stays out</text><text x="654" y="343" fill="#80dfbd" font-size="14" font-weight="400">Only chosen source paths</text><rect x="36" y="396" width="888" height="52" rx="14" fill="#1d2435" stroke="#36425a"/><text x="58" y="428" fill="#b69cff" font-size="12" font-weight="700">SOURCE SIZE ≠ ARCHIVE SIZE</text><text x="343" y="428" fill="#ffffff" font-size="16" font-weight="400">Selection changes the estimate; sources stay unchanged.</text></g></svg>
