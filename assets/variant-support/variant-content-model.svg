<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Variant and shared content model</title>
  <desc id="desc">A generic diagram showing one game with two versions, selectable DLC, and a shared patch.</desc>
  <rect width="960" height="420" rx="28" fill="#111217"/>
  <rect x="36" y="36" width="888" height="348" rx="22" fill="#1F2028"/>
  <text x="72" y="82" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Variant-aware library entry</text>
  <text x="72" y="116" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">One visible game can keep multiple versions and optional content without moving source files.</text>

  <rect x="72" y="156" width="218" height="164" rx="18" fill="#2A2B34"/>
  <text x="98" y="192" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Library entry</text>
  <text x="98" y="222" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">One card in browse</text>
  <rect x="98" y="246" width="110" height="32" rx="16" fill="#6F45BD"/>
  <text x="121" y="267" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">variants</text>
  <text x="98" y="298" fill="#8E91A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">source paths stay put</text>

  <path d="M306 212H376" stroke="#777A88" stroke-width="4" stroke-linecap="round"/>
  <path d="M362 198L378 212L362 226" stroke="#777A88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="398" y="130" width="206" height="112" rx="16" fill="#2A2B34"/>
  <text x="424" y="166" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Normal 1.0</text>
  <text x="424" y="194" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Required base</text>
  <text x="424" y="218" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Archive group</text>
  <text x="424" y="232" fill="#8E91A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">7 source files as one item</text>

  <rect x="398" y="268" width="206" height="78" rx="16" fill="#2A2B34"/>
  <text x="424" y="304" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Normal 1.3</text>
  <text x="424" y="330" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Latest by default</text>
  <text x="424" y="344" fill="#8E91A3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">admin can pin another</text>

  <rect x="676" y="120" width="176" height="84" rx="16" fill="#27352F" stroke="#32C48D" stroke-width="2"/>
  <text x="700" y="154" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Shared content</text>
  <text x="700" y="180" fill="#AEE6CF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Patch / server / mod</text>

  <rect x="676" y="242" width="176" height="84" rx="16" fill="#332C45" stroke="#8D61E8" stroke-width="2"/>
  <text x="700" y="276" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">DLC + extras</text>
  <text x="700" y="302" fill="#D7C6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Per-child or bundle</text>

  <path d="M604 180C632 180 642 162 676 162" stroke="#32C48D" stroke-width="3" stroke-linecap="round"/>
  <path d="M604 308C638 308 642 284 676 284" stroke="#8D61E8" stroke-width="3" stroke-linecap="round"/>
  <path d="M604 308C638 308 642 162 676 162" stroke="#32C48D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>

  <rect x="72" y="354" width="248" height="24" rx="12" fill="#262833"/>
  <text x="88" y="371" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">metadata attaches existing paths</text>
  <rect x="334" y="354" width="258" height="24" rx="12" fill="#262833"/>
  <text x="350" y="371" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">duplicates ignored after grouping</text>
  <rect x="606" y="354" width="246" height="24" rx="12" fill="#262833"/>
  <text x="622" y="371" fill="#B9BBC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">downloads use selected content</text>
</svg>
