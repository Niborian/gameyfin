<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">One game, multiple versions</title><desc id="desc">Concept diagram: one library entry contains two versions. Optional shared content can be attached to either version. Grouped archives remain one logical item. Original source paths stay unchanged.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a9b1c6" stroke-width="1.4"/></marker></defs>
<rect width="960" height="480" rx="24" fill="#10131c"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="36" y="46" fill="#b69cff" font-size="12" font-weight="700">ONE GAME · MULTIPLE VERSIONS</text><text x="36" y="82" fill="#ffffff" font-size="30" font-weight="700">Organize the library—not the source files.</text><rect x="36" y="138" width="210" height="184" rx="14" fill="#1d2435" stroke="#36425a"/><text x="58" y="177" fill="#ffffff" font-size="21" font-weight="700">One library entry</text><text x="58" y="210" fill="#bac3d9" font-size="16" font-weight="400">One card in browse</text><text x="58" y="243" fill="#bac3d9" font-size="16" font-weight="400">Versions live together</text><text x="58" y="286" fill="#80dfbd" font-size="14" font-weight="700">Original paths stay put</text><path d="M246 230H275V183H298" stroke="#a9b1c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M275 230V307H298" stroke="#a9b1c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="312" y="138" width="282" height="98" rx="14" fill="#1d2435" stroke="#36425a"/><text x="334" y="173" fill="#ffffff" font-size="21" font-weight="700">Version 1.0</text><text x="334" y="204" fill="#bac3d9" font-size="16" font-weight="400">Required base + grouped archives</text><rect x="312" y="260" width="282" height="98" rx="14" fill="#1d2435" stroke="#36425a"/><text x="334" y="294" fill="#ffffff" font-size="21" font-weight="700">Version 1.3</text><text x="334" y="327" fill="#bac3d9" font-size="16" font-weight="400">Eligible latest, or an admin pin</text><path d="M594 183H622V218H650" stroke="#a9b1c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M594 307H622V218" stroke="#a9b1c6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="664" y="168" width="260" height="144" rx="14" fill="#16332f" stroke="#4da890"/><text x="686" y="203" fill="#ffffff" font-size="19" font-weight="700">Shared optional content</text><text x="686" y="238" fill="#bac3d9" font-size="16" font-weight="400">Patch · mod · extras</text><text x="686" y="273" fill="#80dfbd" font-size="14" font-weight="400">Attach only where applicable</text><rect x="36" y="396" width="888" height="52" rx="14" fill="#1d2435" stroke="#36425a"/><text x="58" y="428" fill="#b69cff" font-size="12" font-weight="700">GROUPED CONTENT</text><text x="232" y="428" fill="#ffffff" font-size="17" font-weight="400">7 archive parts → 1 selectable item · no moves or renames</text></g></svg>
